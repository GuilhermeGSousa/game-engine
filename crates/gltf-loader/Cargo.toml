[package]
name = "gltf-loader"
version = "0.1.0"
edition = "2024"

[dependencies]
app = { path = "../app" }
animation = { path = "../animation" }
asset-cook = { path = "../asset-cook" }
color = { path = "../color" }
essential = { path = "../essential" }
mesh = { path = "../mesh" }
ecs = { path = "../ecs" }
render = { path = "../render" }
physics = { path = "../physics" }
scene = { path = "../scene" }
gltf = { version = "1.4.1", features = ["KHR_lights_punctual", "extras"] }
anyhow = "1.0.97"
async-trait = "0.1.50"
bincode = "1.3"
glam = { version = "0.30.1" }
log = "0.4.27"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.18.1", features = ["v4", "js"] }
serde_json = "1.0"

[dependencies.image]
version = "0.25.5"
default-features = true
