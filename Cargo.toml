[profile.release]
strip = true

# Release-speed build that keeps debug symbols, for profilers (samply, perf,
# flamegraph, Tracy). Usage: cargo run --profile profiling -p render-test
# See docs/profiling.md.
[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.profiling.package.jolt-ffi]
debug = true

[package]
name = "game-engine"
version = "0.1.0"
edition = "2021"

[features]
default = ["multithreaded"]
multithreaded = ["app/multithreaded"]

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]
members = ["crates/*", "examples/*"]

[lints.rust]
warnings = "deny"

[dependencies]
app = { path = "crates/app" }
animation = { path = "crates/animation" }
essential = { path = "crates/essential" }
render = { path = "crates/render" }
mesh = { path = "crates/mesh" }
gameplay = { path = "crates/gameplay" }
window = { path = "crates/window" }
ecs = { path = "crates/ecs" }
color = { path = "crates/color" }
gltf-loader = { path = "crates/gltf-loader" }
obj-loader = { path = "crates/obj-loader" }
ui = { path = "crates/ui" }
skybox = { path = "crates/skybox" }
world-grid = { path = "crates/world-grid" }

# Physics is not supported on the web: Jolt's C++ requires thread primitives
# that wasm32 toolchains do not provide.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
jolt_physics = { path = "crates/jolt_physics" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "24.0.1", features = ["webgl"] }

[profile.dev.package.jolt-ffi]
opt-level = 3
