[package]
name = "obj-loader"
version = "0.1.0"
edition = "2024"

[dependencies]
app = { path = "../app" }
asset-import = { path = "../asset-import" }
color = { path = "../color" }
essential = { path = "../essential" }
mesh = { path = "../mesh" }
ecs = { path = "../ecs" }
render = { path = "../render" }
scene = { path = "../scene" }
tobj = { version = "4.0.3", default-features = false }
anyhow = "1.0.97"
async-trait = "0.1.50"
bincode = "1.3"
glam = { version = "0.30.1" }
serde = { version = "1", features = ["derive"] }

[dependencies.image]
version = "0.25.5"
default-features = true
