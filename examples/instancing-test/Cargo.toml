[package]
name = "instancing-test"
version = "0.1.0"
edition = "2021"

[features]
default = ["multithreaded"]
multithreaded = ["game-engine/multithreaded"]

[lints.rust]
warnings = "deny"

[dependencies]
game-engine = { path = "../.." }
app = { path = "../../crates/app" }
ecs = { path = "../../crates/ecs" }
essential = { path = "../../crates/essential" }
mesh = { path = "../../crates/mesh" }
render = { path = "../../crates/render" }
color = { path = "../../crates/color" }
gameplay = { path = "../../crates/gameplay" }
glam = "0.30.1"
cfg-if = "1.0.0"
env_logger = "0.11.8"
log = "0.4.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
