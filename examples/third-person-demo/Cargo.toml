[package]
name = "third-person-demo"
version = "0.1.0"
edition = "2021"

[features]
default = ["multithreaded"]
multithreaded = ["game-engine/multithreaded"]

[lints.rust]
warnings = "deny"

[dependencies]
game-engine = { path = "../.." }
gameplay = { path = "../../crates/gameplay" }
physics = { path = "../../crates/physics" }
color = { path = "../../crates/color" }
world-grid = { path = "../../crates/world-grid" }
cfg-if = "1.0.0"
env_logger = "0.11.8"
glam = { version = "0.30.1" }
log = "0.4.27"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0.0"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3.77", features = ["Document", "Window", "Element"] }
